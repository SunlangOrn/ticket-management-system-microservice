server:
  port: 8084

spring:
  application:
    name: order-service
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

logging:
  pattern:
    level: "%5p [${spring.application.name}]"

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    version: "@project.version@"

tms:
  clients:
    ticket-service:
      base-url: http://localhost:8083
      connect-timeout: 2s
      read-timeout: 5s