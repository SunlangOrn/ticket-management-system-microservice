server:
  port: 8083

spring:
  application:
    name: ticket-service
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

logging:
  pattern:
    level: "%5p [${spring.application.name}]"

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    version: "@project.version@"

tms:
  reservation:
    hold: 10m
    expiry-interval: PT30S