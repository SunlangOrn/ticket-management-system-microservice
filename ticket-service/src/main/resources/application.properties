server.port=${SERVER_PORT:8083}
spring.application.name=ticket-service
spring.datasource.url=${TICKET_DB_URL:jdbc:postgresql://localhost:5432/ticket_db}
spring.datasource.username=${TICKET_DB_USERNAME:ticket_user}
spring.datasource.password=${TICKET_DB_PASSWORD}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate