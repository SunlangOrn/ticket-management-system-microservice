spring:
  datasource:
    url: ${TICKET_DB_URL:jdbc:postgresql://localhost:5432/ticket_db}
    username: ${TICKET_DB_USERNAME:ticket_user}
    password: ${TICKET_DB_PASSWORD:ticket_pass}

tms:
  security:
    jwt:
      issuer: ${JWT_ISSUER:http://localhost:8081}
      jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.example: DEBUG
