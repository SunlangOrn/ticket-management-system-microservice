spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

tms:
  security:
    jwt:
      issuer: ${JWT_ISSUER}
      jwk-set-uri: ${JWT_JWK_SET_URI}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.example: INFO