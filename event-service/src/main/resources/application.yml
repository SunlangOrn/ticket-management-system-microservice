server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: event-service
  datasource:
    url: jdbc:postgresql://localhost:5432/ticket_db
    username: ticketuser
    password: ticketpass
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  data:
    web:
      pageable:
        max-page-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "
  include-application-name: false