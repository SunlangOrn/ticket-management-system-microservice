server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: event-service
  datasource:
    url: ${EVENT_DB_URL:jdbc:postgresql://localhost:5432/event_db}
    username: ${EVENT_DB_USERNAME:event_user}
    password: ${EVENT_DB_PASSWORD:event_pass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    baseline-on-migrate: true
    enabled: true
  data:
    web:
      pageable:
        max-page-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "
  include-application-name: false