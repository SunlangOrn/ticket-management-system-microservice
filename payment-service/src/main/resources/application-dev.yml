spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payment_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

tms:
  security:
    jwt:
      issuer: ${JWT_ISSUER:http://localhost:8081}
      jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
  aba:
    merchant-id: ${ABA_MERCHANT_ID}
    api-key: ${ABA_API_KEY}
    generate-qr-url: ${ABA_GENERATE_QR_URL}
    check-transaction-url: ${ABA_CHECK_TRANSACTION_URL}
    callback-url: ${ABA_CALLBACK_URL:}
  clients:
    order-service:
      base-url: ${ORDER_SERVICE_URL:http://localhost:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.example: DEBUG