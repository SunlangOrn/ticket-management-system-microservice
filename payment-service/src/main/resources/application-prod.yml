spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

tms:
  security:
    jwt:
      issuer: ${JWT_ISSUER}
      jwk-set-uri: ${JWT_JWK_SET_URI}
  aba:
    merchant-id: ${ABA_MERCHANT_ID}
    api-key: ${ABA_API_KEY}
    generate-qr-url: ${ABA_GENERATE_QR_URL}
    check-transaction-url: ${ABA_CHECK_TRANSACTION_URL}
    callback-url: ${ABA_CALLBACK_URL:}
  clients:
    order-service:
      base-url: ${ORDER_SERVICE_URL}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.example: INFO